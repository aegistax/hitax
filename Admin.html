<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
:root{--navy:#16233f;--gold:#b8913a;--gold-soft:#f5eedd;--ink:#1d2433;--sub:#5b6577;--line:#e3e6ec;--bg:#f4f5f8;--ai:#3c6fd8;--ai-soft:#e9f0fd;--red:#b42318}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}
.hbar{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--gold)}.logo small{font-weight:400;font-size:12px;color:#aab4c8;margin-left:6px}
.hbtn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none}
main{max-width:860px;margin:0 auto;padding:14px 14px 120px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab b{font-weight:700;margin-left:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card h3{margin:4px 0 0;font-size:15px;line-height:1.45}
.meta{font-size:12px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.b-ai{background:var(--ai-soft);color:var(--ai)}.b-hi{background:#f8f1e1;color:#8a6a22}
.st{background:#eef0f4;color:var(--sub)}.st.접수{background:#fde8e8;color:var(--red)}.st.답변작성중{background:#fff4e0;color:#a86400}
.st.공개됨{background:#e9f0fd;color:var(--ai)}.st.답변완료{background:#e6f5ec;color:#1e7a44}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.panel h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.raw{background:var(--bg);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:14px;margin-bottom:8px;max-height:260px;overflow:auto}
.raw.ai{background:var(--ai-soft)}
.lbl{font-size:12px;color:var(--sub);margin:10px 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lbl b{color:var(--ink);font-size:13px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;font-family:inherit;background:#fff}
textarea{resize:vertical;min-height:90px}
textarea.big{min-height:300px}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.req{color:var(--red)}
.info{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:13.5px}
.info dt{color:var(--sub)}.info dd{margin:0;word-break:break-all}
.actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20}
.actions .in{max-width:860px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.p{background:var(--gold);color:#fff;flex:1;min-width:150px}
.btn.s{background:var(--navy);color:#fff}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.d{background:#fff;border:1px solid #f3c4c4;color:var(--red)}
.more{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:20px}
.box h3{margin:0 0 8px;font-size:17px}
.box p{margin:0 0 16px;white-space:pre-line;font-size:14px;color:var(--sub)}
.box .row{display:flex;gap:8px;justify-content:flex-end}
.pv{max-width:900px;height:92vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.pv .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.pv iframe{flex:1;border:0;width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.toast.err{background:var(--red)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:70;font-weight:600}
.dirty{font-size:12px;color:#a86400}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo">HI <span>Tax</span><small>관리자</small></div>
    <div style="display:flex;gap:6px">
      <a class="hbtn" href="https://hitax.io.kr" target="_blank">사이트</a>
      <button class="hbtn" id="refresh">새로고침</button>
    </div>
  </div>
</header>

<main>
  <!-- 목록 -->
  <section id="listView">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </section>

  <!-- 상세 -->
  <section id="detailView" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="btn g" id="back">← 목록</button>
      <span class="dirty" id="dirty" hidden>저장 안 된 변경 있음</span>
    </div>

    <div class="panel">
      <h2><span id="dTitle"></span></h2>
      <dl class="info" id="dInfo"></dl>
    </div>

    <div class="panel">
      <h2>접수 원문 <button class="mini" id="copyPrompt">AI 초안용 복사</button></h2>
      <div class="lbl"><b>제목</b></div><div class="raw" id="rTitle"></div>
      <div class="lbl"><b id="rQLabel">질문</b></div><div class="raw" id="rQ"></div>
      <div id="rAIWrap"><div class="lbl"><b id="rAILabel">AI 답변</b></div><div class="raw ai" id="rAI"></div></div>
    </div>

    <div class="panel">
      <h2>답변 작성</h2>
      <div id="verdictWrap">
        <div class="lbl"><b>검토판정 <span class="req">*</span></b></div>
        <select data-f="검토판정">
          <option value="">선택</option><option>맞음</option><option>일부 맞음</option><option>보완 필요</option><option>틀림</option>
        </select>
      </div>
      <div class="lbl"><b id="ansLabel">세무사 답변 <span class="req">*</span></b></div>
      <textarea class="big" data-f="세무사 답변" placeholder="빈 줄 = 문단 나누기&#10;## 소제목&#10;**굵게**"></textarea>
      <div class="hint">빈 줄로 문단을 나누고, <b>## 소제목</b>, <b>**굵게**</b>를 쓸 수 있습니다.</div>
      <div class="lbl"><b>근거</b></div>
      <input type="text" data-f="근거" placeholder="예) 소득세법 제33조의2">
      <div class="lbl"><b>요약 (목록에 표시)</b></div>
      <textarea data-f="요약" style="min-height:60px" placeholder="비우면 답변 앞부분이 자동으로 쓰입니다."></textarea>
    </div>

    <div class="panel">
      <h2>공개용 편집 <span style="font-size:12px;color:var(--sub);font-weight:400">비우면 원문이 공개됨</span></h2>
      <div class="lbl"><b>공개 제목</b><button class="mini" data-copy="공개제목">원문 가져오기</button></div>
      <input type="text" data-f="공개제목">
      <div class="lbl"><b>공개 질문</b><button class="mini" data-copy="공개질문">원문 가져오기</button></div>
      <textarea data-f="공개질문" style="min-height:120px"></textarea>
      <div id="pubAIWrap">
        <div class="lbl"><b>공개 AI 답변</b><button class="mini" data-copy="공개AI답변">원문 가져오기</button></div>
        <textarea data-f="공개AI답변" style="min-height:120px"></textarea>
      </div>
      <div class="hint">⚠️ 이름·상호·연락처·사업자번호·주소·구체적 금액 등 개인을 알아볼 수 있는 정보를 지워 주세요.</div>
    </div>
  </section>
</main>

<div class="actions" id="actions" hidden>
  <div class="in">
    <button class="btn g" data-act="save">저장</button>
    <button class="btn g" data-act="preview">미리보기</button>
    <button class="btn p" data-act="both">★ 공개 + 회신</button>
    <div class="more">
      <button class="btn g" data-act="publish">공개만</button>
      <button class="btn g" data-act="send">회신만</button>
      <button class="btn d" data-act="unpublish" id="btnUnpub">공개 취소</button>
      <button class="btn g" data-act="skip">미답변 처리</button>
    </div>
  </div>
</div>

<div class="modal" id="confirm" hidden>
  <div class="box"><h3 id="cTitle"></h3><p id="cMsg"></p>
    <div class="row"><button class="btn g" id="cNo">취소</button><button class="btn s" id="cYes">확인</button></div>
  </div>
</div>
<div class="modal" id="preview" hidden>
  <div class="box pv"><div class="top"><b>미리보기 (실제 공개 화면)</b><button class="btn g" id="pvClose">닫기</button></div>
    <iframe id="pvFrame" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe></div>
</div>
<div class="busy" id="busy" hidden><span id="busyMsg">처리 중…</span></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TABS = [
  {k:'todo', t:'답변 대기', f:x => ['접수','답변작성중',''].includes(x.status)},
  {k:'pub',  t:'공개됨',   f:x => x.status === '공개됨'},
  {k:'done', t:'답변완료', f:x => x.status === '답변완료'},
  {k:'etc',  t:'미답변·비공개', f:x => ['미답변','비공개','삭제요청'].includes(x.status)},
  {k:'all',  t:'전체',     f:() => true}
];
let items = [], tab = 'todo', cur = null, dirty = false;

function call(fn, ...args){
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
}
function busy(on, msg){ $('#busy').hidden = !on; $('#busyMsg').textContent = msg || '처리 중…'; }
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, err ? 6000 : 3500);
}
function ask(title, msg){
  return new Promise(r => {
    $('#cTitle').textContent = title; $('#cMsg').textContent = msg; $('#confirm').hidden = false;
    $('#cYes').onclick = () => { $('#confirm').hidden = true; r(true); };
    $('#cNo').onclick  = () => { $('#confirm').hidden = true; r(false); };
  });
}
function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 목록 ── */
async function loadList(){
  busy(true, '불러오는 중…');
  try { items = await call('adminList'); renderList(); }
  catch(e){ toast(e.message, true); }
  busy(false);
}
function renderList(){
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab ${t.k === tab ? 'on' : ''}" data-k="${t.k}">${t.t}<b>${items.filter(t.f).length}</b></button>`).join('');
  $$('#tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.k; renderList(); });
  const rows = items.filter(TABS.find(t => t.k === tab).f);
  $('#list').innerHTML = rows.length ? rows.map(x => `
    <div class="card" data-t="${esc(x.ticket)}">
      <div class="meta">
        <span class="badge ${x.type.includes('AI') ? 'b-ai' : 'b-hi'}">${x.type.includes('AI') ? 'AI 검토' : 'Q&A'}</span>
        <span class="badge st ${esc(x.status)}">${esc(x.status || '접수')}</span>
        <span>${esc(x.cat)}</span><span>${esc(x.date)}</span><span>${esc(x.ticket)}</span>
      </div>
      <h3>${esc(x.title)}</h3>
    </div>`).join('') : '<div class="empty">해당하는 질문이 없습니다.</div>';
  $$('#list .card').forEach(c => c.onclick = () => openDetail(c.dataset.t));
}

/* ── 상세 ── */
async function openDetail(ticket){
  busy(true, '불러오는 중…');
  try { fill(await call('adminGet', ticket)); }
  catch(e){ toast(e.message, true); busy(false); return; }
  busy(false);
  $('#listView').hidden = true; $('#detailView').hidden = false; $('#actions').hidden = false;
  window.scrollTo(0, 0);
}
function fill(d){
  cur = d; setDirty(false);
  $('#dTitle').textContent = d['제목'];
  const info = [['접수번호',d['접수번호']],['접수일시',d['접수일시']],['유형',d['유형']],['사업형태',d['사업형태']],
    ['분야',d['분야']],['이메일',d['이메일'] || '(삭제됨)'],['상태',d['상태'] || '접수'],
    ['답변일시',d['답변일시']],['공개URL',d['공개URL'] ? `<a href="${esc(d['공개URL'])}" target="_blank">${esc(d['공개URL'])}</a>` : '-']];
  $('#dInfo').innerHTML = info.map(([k, v]) => `<dt>${k}</dt><dd>${k === '공개URL' ? v : esc(v || '-')}</dd>`).join('');
  $('#rTitle').textContent = d['제목'];
  $('#rQ').textContent = d['질문'];
  $('#rQLabel').textContent = d.isAI ? 'AI에게 한 질문' : '질문';
  $('#rAIWrap').hidden = $('#verdictWrap').hidden = $('#pubAIWrap').hidden = !d.isAI;
  $('#rAILabel').textContent = 'AI 답변 (' + (d['사용AI'] || 'AI') + ')';
  $('#rAI').textContent = d['AI답변'];
  $('#ansLabel').innerHTML = (d.isAI ? '세무사 검토 의견' : '세무사 답변') + ' <span class="req">*</span>';
  $$('[data-f]').forEach(el => el.value = d[el.dataset.f] || '');
  $('#btnUnpub').hidden = !d['공개URL'];
}
function fields(){
  const o = {}; $$('[data-f]').forEach(el => o[el.dataset.f] = el.value); return o;
}
function setDirty(v){ dirty = v; $('#dirty').hidden = !v; }
$$('[data-f]').forEach(el => el.addEventListener('input', () => setDirty(true)));
$$('[data-copy]').forEach(b => b.onclick = () => {
  const k = b.dataset.copy, src = {공개제목:'제목', 공개질문:'질문', 공개AI답변:'AI답변'}[k];
  const el = document.querySelector(`[data-f="${k}"]`);
  el.value = cur[src] || ''; setDirty(true); el.focus();
});

$('#back').onclick = async () => {
  if (dirty && !(await ask('저장하지 않고 나갈까요?', '작성 중인 내용이 저장되지 않았습니다.'))) return;
  $('#detailView').hidden = true; $('#actions').hidden = true; $('#listView').hidden = false;
  loadList();
};
$('#refresh').onclick = () => cur && !$('#detailView').hidden ? openDetail(cur['접수번호']) : loadList();

$('#copyPrompt').onclick = () => {
  const d = cur;
  const text = (d.isAI
    ? `아래는 사업자가 AI에게 받은 세무 답변입니다. 세무사 관점에서 맞는 부분, 틀린 부분, 빠진 부분을 검토하고 관련 조문 근거를 붙여 공개용 검토 의견 초안을 써 주세요. 판정은 맞음/일부 맞음/보완 필요/틀림 중 하나로 제시해 주세요.\n\n[사업형태] ${d['사업형태']}\n[분야] ${d['분야']}\n[AI에게 한 질문]\n${d['질문']}\n\n[AI 답변 (${d['사용AI']})]\n${d['AI답변']}`
    : `아래 사업자 세금 질문에 세무사로서 공개용 답변 초안을 써 주세요. 결론을 먼저 쓰고, 상황별 차이와 관련 조문 근거를 붙여 주세요.\n\n[사업형태] ${d['사업형태']}\n[분야] ${d['분야']}\n[제목] ${d['제목']}\n[질문]\n${d['질문']}`)
    + `\n\n형식: 빈 줄로 문단 구분, 소제목은 "## ", 강조는 **굵게**. 개인을 알아볼 수 있는 정보는 넣지 마세요.`;
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  toast(ok ? '복사했습니다. Claude 등에 붙여넣어 초안을 받으세요.' : '복사가 안 되면 원문을 직접 선택해 복사해 주세요.', !ok);
};

/* ── 실행 ── */
$$('[data-act]').forEach(b => b.onclick = () => run(b.dataset.act));
async function run(act){
  const f = fields(), t = cur['접수번호'];
  if (['both','publish','send','preview'].includes(act) && !f['세무사 답변'].trim()) return toast('답변을 먼저 입력해 주세요.', true);
  if (['both','publish','preview'].includes(act) && cur.isAI && !f['검토판정']) return toast('검토판정을 선택해 주세요.', true);

  try {
    if (act === 'save'){
      busy(true, '저장 중…'); fill(await call('adminSave', t, f)); toast('저장했습니다.');
    }
    else if (act === 'preview'){
      busy(true, '미리보기 만드는 중…');
      const html = await call('adminPreview', t, f); setDirty(false);
      $('#pvFrame').srcdoc = html; $('#preview').hidden = false;
    }
    else {
      const msgs = {
        both: ['공개하고 회신할까요?', `누구나 볼 수 있게 공개되고, 질문자(${cur['이메일'] || '이메일 없음'})에게 답변 메일이 발송됩니다.\n\n개인정보가 지워졌는지 확인하셨나요?` + (!f['공개질문'].trim() ? '\n\n※ 공개 질문이 비어 있어 원문이 그대로 공개됩니다.' : '')],
        publish: ['웹에 공개할까요?', '누구나 볼 수 있게 공개됩니다. 개인정보가 지워졌는지 확인하셨나요?' + (!f['공개질문'].trim() ? '\n\n※ 공개 질문이 비어 있어 원문이 그대로 공개됩니다.' : '')],
        send: ['답변 메일을 보낼까요?', `${cur['이메일'] || '이메일 없음'} 주소로 발송합니다.` + (cur['상태'] === '답변완료' ? '\n\n※ 이미 회신한 질문입니다.' : '')],
        unpublish: ['공개를 취소할까요?', '답변 페이지가 삭제되고 목록에서 빠집니다.'],
        skip: ['미답변으로 처리할까요?', '답변 대기 목록에서 빠집니다. 질문자에게 메일은 가지 않습니다.']
      };
      if (!(await ask(...msgs[act]))) return;
      busy(true, act === 'send' ? '메일 보내는 중…' : 'GitHub에 반영 중… (10~20초)');
      const r = await call('adminAction', t, act === 'unpublish' || act === 'skip' ? null : f, act);
      fill(r.item);
      toast({ both: '공개 + 회신 완료! 사이트 반영까지 1~2분 걸립니다.', publish: '공개 완료! 사이트 반영까지 1~2분 걸립니다.',
              send: '회신 메일을 보냈습니다.', unpublish: '공개를 취소했습니다.', skip: '미답변으로 처리했습니다.' }[act]);
    }
  } catch(e){ toast(e.message || String(e), true); }
  busy(false);
}
$('#pvClose').onclick = () => { $('#preview').hidden = true; $('#pvFrame').srcdoc = ''; };
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
loadList();
</script>
